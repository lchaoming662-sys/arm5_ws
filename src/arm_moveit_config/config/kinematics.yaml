# ============================================================================
# kinematics.yaml — 逆运动学求解器
# ============================================================================
# 本机只装了 KDL（没有 pick_ik / trac_ik / bio_ik），所以只能用它。
#
# 注意：position_only_ik: true 是这条臂能用 MoveIt 的关键
#
#   本臂只有 5 个自由度（top_plate_joint..claw_base_joint）。KDL 默认要做【完整 6D 位姿】IK，
#   5 自由度永远解不出来 —— 表现为 RViz 里拖目标位姿后 Plan 一直失败，
#   报 "Unable to find a valid IK solution"，而且不告诉你为什么。
#
#   开启 position_only_ik 后，KDL 只用位置（3 个约束）参与求解，
#   剩下的姿态自由度由它自行分配 —— 对抓取/取放这类任务足够用。
#
#   验证是否生效：
#       ros2 service call /compute_ik moveit_msgs/srv/GetPositionIK \
#         "{ik_request: {group_name: arm, ik_link_name: tcp, \
#           pose_stamped: {header: {frame_id: world}, \
#             pose: {position: {x: 0.027, y: 0.12, z: 0.25}, \
#                    orientation: {w: 1.0}}}}}"
# ============================================================================

arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5
  position_only_ik: true

# 【已删】这里原先还给 gripper 组配了一份 KDL 求解器，但 gripper 不是 chain
# （它是两个独立的指关节 right_claw_joint / left_claw_joint，没有共同末端），
# KDL 对非 chain 组直接拒绝，于是每次加载机器人模型都刷三条 ERROR：
#     Group 'gripper' is not a chain
#     Kinematics solver of type 'kdl_kinematics_plugin/KDLKinematicsPlugin'
#       could not be initialized for group 'gripper'
#     Kinematics solver could not be instantiated for joint group gripper
# 而它从来没被用到：夹爪的开合一律走 JointInterpolationPlanner（1 个自由度，
# 插值就是精确解，见 MTC 段 open gripper / close gripper 两个阶段），
# 不需要 IK。留着它只会让人以为夹爪也走 IK。
#
# 真要给夹爪做 IK，得先把它改成 chain（补一个固定的 palm 连杆），那是另一件事。
