#       could not be initialized for group 'gripper'
#     Kinematics solver could not be instantiated for joint group gripper
# 而它从来没被用到：夹爪的开合一律走 JointInterpolationPlanner（1 个自由度，
# 插值就是精确解，见 MTC 段 open gripper / close gripper 两个阶段），
# 不需要 IK。留着它只会让人以为夹爪也走 IK。
#
# 真要给夹爪做 IK，得先把它改成 chain（补一个固定的 palm 连杆），那是另一件事。
