# ============================================================================
# joint_limits.yaml — 速度 / 加速度限位
# ============================================================================
# URDF 里只声明了位置与速度上限（臂关节 3.0 rad/s），没有加速度；
# MoveIt 需要加速度才能做时间参数化。这里补上，并把速度压得比 URDF 保守。
#
# 注意：这里给的是**仿真用值**，与 MG996R 的真实能力无关。
#
# ---------------------------------------------------------------------------
# 为什么不是越小越安全
# ---------------------------------------------------------------------------
# 实际速度 = max_velocity × 请求里的 max_velocity_scaling_factor
# 实际加速度 = max_acceleration × 请求里的 max_acceleration_scaling_factor
#
# 早期为了"稳"把两边都压到 0.2，结果是：实际只有 0.24 rad/s、0.2 rad/s²，
# 动 1 rad 要 3 秒以上；再乘上本机 RTF ~0.15，一次抓取要跑好几分钟。
# 这个臂的仿真驱动（gz_ros2_control 的位置伺服）是够力气的，压这么低纯属浪费。
#
# 注意：提速的**风险**在 JointTrajectoryController 的容差（arm_controllers.yaml）：
#    跟得越快、滞后越大，一旦超过 trajectory 容差就会被 ABORT 掐断，
#    报 "path tolerance violation"。所以提速后必须实测跟踪误差，
#    不能只看"命令发出去了"。
# ============================================================================

# 每次规划默认用到限位的比例（请求里再乘一次 scaling factor）
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  top_plate_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
  lower_arm_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
  upper_arm_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
  # ---------------------------------------------------------------------------
  # wrist_joint / claw_base_joint：位置限位各收 0.0708 rad（±1.5708 → ±1.50）
  # ---------------------------------------------------------------------------
  # 只收这两个，不收另外三个臂关节。为什么：
  #   URDF 里五个臂关节共用 ±1.5708 的位置限位，而 MoveIt 这条链路走
  #   position_only_ik（5 自由度只能约束位置），KDL 解出来的位形会把**腕部
  #   这两个关节**一路顶到限位上停住；top_plate / lower_arm / upper_arm
  #   在实测里离限位都很远（最小 -0.25 ~ -0.39），没有必要动。
  #
  #   实测（干净单仿真跑完整抓取演示，采样 /arm_controller/state 与 /joint_states）：
  #       wrist_joint      实际最小 -1.57080（正好是硬限位的值）
  #                        跟踪误差峰值 0.07705
  #       claw_base_joint  实际最小 -1.57080
  #                        跟踪误差峰值 0.08000
  #   而 arm_controllers.yaml 给的 trajectory 容差是 0.12 ——
  #   claw_base 的余量只剩 1.50 倍，是全臂最紧的。
  #
  #   关节顶在硬止点上时，位置约束和伺服在抢同一个自由度，跟踪误差就是
  #   在这个位形上最大。之前那次 CONTROL_FAILED(-4) 正是腕关节误差冲到
  #   0.121 越过容差被掐断。
  #   （关节"停在限位上"和"关节坏了"是两件事：从零位走到 -1.5708 再回来
  #     是成功的，详见 docs/踩坑记录.md 第 31 条。）
  #
  # 为什么是 0.0708、不再往大里收：
  #   tools/solve_grasp_poses.py 解出的设计抓取位形用的是 wrist = -1.466。
  #   收得比它更紧（例如 ±1.45）会让这个设计位形直接不可达。
  #   0.0708 既让关节离开硬止点，又给设计位形留 0.034 rad 余量。
  #   claw_base 没有这个问题：设计位形里它取 0，收紧不影响任何设计值。
  #
  # 这层余量的作用边界（别误读）：
  #   它只改**规划模型**的变量边界，让规划器与 IK 不再产生落在硬止点上的目标。
  #   它不改 URDF 的物理限位，也不代表机械上真有这么大余量。
  #   如果要更彻底，应该重解抓取位形、让腕角压根不靠近限位；
  #   现在 tools/pick_demo.py 的 PREGRASP / LIFT 还写着 wrist = -1.55
  #   （离硬限位只有 0.021 rad），那是改 tools/ 的事，不在这份配置里。
  # ---------------------------------------------------------------------------
  wrist_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
    has_position_limits: true
    min_position: -1.50
    max_position: 1.50
  claw_base_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
    has_position_limits: true
    min_position: -1.50
    max_position: 1.50

  # 夹爪限位区间只有 0.9 rad，速度给大了容易冲过方块。保持保守。
  right_claw_joint:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.3
  left_claw_joint:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.3
